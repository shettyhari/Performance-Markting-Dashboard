<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<script>try{var _t=localStorage.getItem("lp-theme");if(_t==="dark"||_t==="light")document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Qlarity Console</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/qlarity-icon-32.png">
<link rel="apple-touch-icon" href="brand/qlarity-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Qlarity Console: the platform view for the Qlarity team (api/admin.js). Brand colours; light and dark share the lp-theme choice. */
:root{
  --cyan:#00c2fb;--cyan2:#00e3ff;--blue:#005df5;--deep:#052885;--navy:#021434;
  --bg:#f4f7fc;--panel:#ffffff;--soft:#f3f8ff;--ink:#021434;--fg:#3a4660;--muted:#667089;--line:#e3eaf5;--line2:#d3dded;
  --series:#005df5;--series-soft:rgba(0,93,245,.12);--accent-text:#005df5;--shadow:0 1px 2px rgba(2,20,52,.04),0 8px 24px rgba(2,20,52,.06);
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--good-bg:rgba(12,163,12,.1);--warn-bg:rgba(250,178,25,.14);--crit-bg:rgba(208,59,59,.1);
  color-scheme:light;
}
:root[data-theme="dark"]{--bg:#040b1d;--panel:#0b1736;--soft:#0e1d42;--ink:#eef3ff;--fg:#c3cde3;--muted:#8d99b5;--line:#1a2a50;--line2:#26396a;
  --series:#1a9cf0;--series-soft:rgba(26,156,240,.16);--accent-text:#00c2fb;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --good-bg:rgba(12,163,12,.16);--warn-bg:rgba(250,178,25,.14);--crit-bg:rgba(208,59,59,.18);color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#040b1d;--panel:#0b1736;--soft:#0e1d42;--ink:#eef3ff;--fg:#c3cde3;--muted:#8d99b5;--line:#1a2a50;--line2:#26396a;
  --series:#1a9cf0;--series-soft:rgba(26,156,240,.16);--accent-text:#00c2fb;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --good-bg:rgba(12,163,12,.16);--warn-bg:rgba(250,178,25,.14);--crit-bg:rgba(208,59,59,.18);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;color:var(--ink);margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
a{color:var(--accent-text)}
.num{font-variant-numeric:tabular-nums}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--navy) 0%,var(--deep) 70%,#0a3fb3 100%);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px}
.top img{height:30px;width:auto;display:block}
.badge-console{font:700 11px/1 Inter;letter-spacing:.14em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:rgba(0,227,255,.14);color:var(--cyan2);border:1px solid rgba(0,227,255,.3)}
.top .sp{flex:1}
.top .who{font-size:13px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.ibtn{height:36px;min-width:36px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:13px;font-weight:500;text-decoration:none}
.ibtn:hover{background:rgba(255,255,255,.14)}
.ibtn svg{width:17px;height:17px}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* tabs */
.tabs{max-width:1320px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:rgba(255,255,255,.66);padding:11px 14px 13px;font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--cyan2)}
.tab .cnt{margin-left:6px;font-size:11px;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.14)}
/* layout */
main{max-width:1320px;margin:0 auto;padding:24px 24px 64px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card h2{font-size:16px}
.card .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.kpi .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font:800 28px/1.15 "Inter Tight",Inter,sans-serif;color:var(--ink);margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12.5px;color:var(--muted);margin-top:4px}
.meter{height:6px;border-radius:999px;background:var(--soft);margin-top:10px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:999px;background:var(--series)}
.meter.warn i{background:var(--warn)} .meter.crit i{background:var(--crit)}
.section-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.section-t h2{font-size:18px}
/* status banner */
.status{display:flex;gap:14px;align-items:flex-start;border-radius:14px;padding:16px 18px;margin-bottom:16px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.status .ico{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center}
.status .ico svg{width:19px;height:19px}
.status.ok .ico{background:var(--good-bg);color:var(--good)}
.status.bad .ico{background:var(--crit-bg);color:var(--crit)}
.status.warn .ico{background:var(--warn-bg);color:#b07600}
:root[data-theme="dark"] .status.warn .ico{color:var(--warn)}
.status h3{font-size:15.5px}
.status p{margin:2px 0 0;color:var(--muted);font-size:13px}
.issues{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.issue{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.issue .pill{flex:none}
.issue b{color:var(--ink);font-weight:600}
.issue .d{color:var(--muted);font-size:12.5px;word-break:break-word}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill svg{width:12px;height:12px}
.pill.good{background:var(--good-bg);color:var(--good);border-color:rgba(12,163,12,.25)}
.pill.warn{background:var(--warn-bg);color:#946300;border-color:rgba(250,178,25,.35)}
:root[data-theme="dark"] .pill.warn{color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit);border-color:rgba(208,59,59,.3)}
.pill.info,.pill.mute{background:var(--soft);color:var(--muted);border-color:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.warn,:root:not([data-theme="light"]) .status.warn .ico{color:var(--warn)}}
/* tables */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:200px;height:38px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);color:var(--ink);padding:0 12px;font:inherit}
.search:focus,select:focus,.btn:focus-visible,.tab:focus-visible,.ibtn:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
select{height:38px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);color:var(--ink);padding:0 10px;font:inherit}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap;position:sticky;top:0}
th.r,td.r{text-align:right}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--soft)}
td .main{color:var(--ink);font-weight:600}
td .small{color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent-text);color:var(--accent-text)}
.btn.danger{color:var(--crit)} .btn.danger:hover{border-color:var(--crit);background:var(--crit-bg)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--deep);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.expand{background:none;border:0;color:var(--accent-text);font-size:12px;padding:0;margin-top:3px}
.breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 18px;padding:4px 0 2px;font-size:12px}
.breakdown span{display:flex;justify-content:space-between;gap:8px;color:var(--muted);border-bottom:1px dashed var(--line);padding:3px 0}
.breakdown b{color:var(--ink);font-weight:500}
/* bar list (storage by workspace) */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) 1fr 74px;gap:12px;align-items:center;font-size:13px;position:relative}
.bar-row .n{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .t{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar-row .t i{display:block;height:100%;background:var(--series);border-radius:0 4px 4px 0;min-width:2px}
.bar-row .v{text-align:right;color:var(--fg)}
.bar-row:hover .t i{filter:brightness(1.12)}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:150px;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10.5px;font-family:Inter,sans-serif}
.chart .ln{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--series-soft)}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .dot{fill:var(--series);stroke:var(--panel);stroke-width:2}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;padding:7px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:5}
.tip b{font-weight:600}
:root[data-theme="dark"] .tip{background:#eef3ff;color:#021434}
.empty{color:var(--muted);font-size:13px;padding:24px;text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--ink);text-align:right;word-break:break-word}
.svc{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.svc:last-child{border-bottom:0}
.svc span:first-child{color:var(--ink);font-weight:500}
/* events */
.ev{display:grid;grid-template-columns:132px 74px 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;align-items:start}
.ev:last-child{border-bottom:0}
.ev .when{color:var(--muted);font-size:12px}
.ev .msg{color:var(--ink);word-break:break-word}
.ev .msg small{display:block;color:var(--muted);font-size:12px}
/* gate, modal, toast */
.gate{max-width:440px;margin:12vh auto;text-align:center;padding:0 16px}
.gate .card{padding:32px 28px}
.gate h1{font-size:22px;margin:14px 0 8px}
.gate p{color:var(--muted);margin:0 0 20px}
.gate .btn{height:40px;padding:0 18px;font-size:14px;display:inline-flex;align-items:center;text-decoration:none}
.modal-bg{position:fixed;inset:0;background:rgba(2,20,52,.55);display:grid;place-items:center;z-index:60;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:460px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{margin:0 0 14px;color:var(--fg)}
.modal input{width:100%;height:40px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);color:var(--ink);padding:0 12px;font:inherit;margin-bottom:16px}
.modal .row{display:flex;justify-content:flex-end;gap:8px}
.modal .btn{height:36px;padding:0 14px}
.modal .err{color:var(--crit);font-size:13px;margin:-8px 0 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.toast.err{background:var(--crit)}
.skel{height:110px;border-radius:14px;background:linear-gradient(90deg,var(--panel),var(--soft),var(--panel));background-size:200% 100%;animation:sk 1.2s ease-in-out infinite;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
.hide-sm{}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.two,.three{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .top-in,.tabs,main{padding-left:16px;padding-right:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:22px}
  .top .who,.hide-sm{display:none}
  .top-in{gap:8px}
  .top img{height:26px}
  .badge-console{font-size:10px;padding:5px 7px}
  .ibtn{padding:0 9px}
  .issue{flex-direction:column;gap:6px}
  .status{padding:14px}
  .bar-row{grid-template-columns:minmax(0,96px) 1fr 64px}
  .ev{grid-template-columns:1fr;gap:4px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a href="/" aria-label="Qlarity home"><img src="brand/qlarity-logo-dark.png" alt="Qlarity" width="620" height="200"></a>
    <span class="badge-console">Console</span>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <span class="hide-sm" id="updated" style="font-size:12px;color:rgba(255,255,255,.6)"></span>
    <button class="ibtn" id="refresh" type="button" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <button class="ibtn" id="theme" type="button" aria-label="Switch theme" title="Switch theme"></button>
    <a class="ibtn" href="/app" title="Open the dashboard" aria-label="Open the dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="hide-sm">Dashboard</span></a>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"><div class="grid kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var ICON = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
    crit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'
  };
  var LEVEL = { error: ["crit", "Critical", ICON.crit], warn: ["warn", "Warning", ICON.warn], info: ["info", "Info", ICON.info] };
  var pill = function (cls, label, icon) { return '<span class="pill ' + cls + '">' + (icon || "") + esc(label) + "</span>"; };
  var levelPill = function (l) { var x = LEVEL[l] || LEVEL.info; return pill(x[0], x[1], x[2]); };

  /* ---------- formatting ---------- */
  var nf = new Intl.NumberFormat("en-IN");
  var n = function (v) { return v == null || isNaN(v) ? "N/A" : nf.format(Number(v)); };
  function bytes(b) {
    if (b == null || isNaN(b)) return "N/A"; b = Number(b);
    var u = ["B", "KB", "MB", "GB", "TB"], i = 0; while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return (i === 0 ? b : b.toFixed(b >= 100 ? 0 : b >= 10 ? 1 : 2)) + " " + u[i];
  }
  function ago(t) {
    if (!t) return "never"; var s = (Date.now() - new Date(t).getTime()) / 1000;
    if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago"; if (s < 86400) return Math.floor(s / 3600) + " h ago";
    if (s < 86400 * 45) return Math.floor(s / 86400) + " d ago"; return new Date(t).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  }
  var when = function (t) { return t ? new Date(t).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "N/A"; };
  function dur(s) { s = Number(s) || 0; var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600); return d ? d + " d " + h + " h" : h + " h " + Math.floor(s % 3600 / 60) + " min"; }
  var pct = function (a, b) { return b ? Math.round(1000 * a / b) / 10 : null; };

  /* ---------- session (shared with the dashboard: lp-session) ---------- */
  function token() {
    try { var j = JSON.parse(localStorage.getItem("lp-session") || "null"); if (!j || !j.token) return "";
      var exp = JSON.parse(atob(j.token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp * 1000; return exp > Date.now() ? j.token : ""; } catch (e) { return ""; }
  }
  function api(op, body) {

    }).join("");
    return '<div class="section-t" style="margin-top:0"><h2>Workspaces</h2><span class="sub" style="color:var(--muted)">' + n(list.length) + " shown · counts and sizes only, never lead details</span></div>" +
      '<div class="tools"><input class="search" type="search" placeholder="Search by name, owner or public id" data-q="orgs" value="' + esc(S.q.orgs) + '" aria-label="Search workspaces"></div>' +
      (list.length ? '<div class="tw"><table><thead><tr><th>Workspace</th><th class="r">Members</th><th class="r">Leads</th><th class="r">Ad rows</th><th class="r">Storage</th><th>Last upload</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody>' + rows + "</tbody></table></div>" : '<div class="card empty">No workspaces match.</div>');
  }

  function viewUsers(d) {
    var q = S.q.users.toLowerCase(), f = S.userState;
    var list = (d.users || []).filter(function (u) { var st = userState(u)[1].toLowerCase(); return (!q || (u.email + " " + u.name + " " + u.workspaces.map(function (w) { return w.name; }).join(" ")).toLowerCase().indexOf(q) >= 0) && (f === "all" || st === f); });
    var rows = list.map(function (u) {
      var st = userState(u), me = S.me === u.email;
      var acts = (!u.confirmed_at ? '<button class="btn" data-act="user-resend" data-id="' + u.id + '">Resend email</button>' : "") +
        '<button class="btn" data-act="user-signout" data-id="' + u.id + '">Sign out</button>' +
        (u.disabled_at || st[1] === "Locked" ? '<button class="btn" data-act="user-enable" data-id="' + u.id + '">' + (u.disabled_at ? "Enable" : "Unlock") + "</button>" : '<button class="btn danger" data-act="user-disable" data-id="' + u.id + '"' + (me ? " disabled title=\"That's you\"" : "") + ">Disable</button>");
      return "<tr><td><div class=\"main\">" + esc(u.email) + "</div>" + (u.name ? '<div class="small">' + esc(u.name) + "</div>" : "") + "</td>" +
        "<td>" + (u.workspaces.length ? u.workspaces.map(function (w) { return '<div class="small" style="color:var(--fg)">' + esc(w.name) + ' <span style="color:var(--muted)">· ' + esc(w.owner ? "owner" : w.role) + (w.active ? "" : " · suspended") + "</span></div>"; }).join("") : '<span class="small">none yet</span>') + "</td>" +
        "<td>" + esc(ago(u.created_at)) + '</td><td>' + esc(ago(u.last_sign_in)) + (u.failed_logins ? '<div class="small">' + n(u.failed_logins) + " wrong password" + (u.failed_logins > 1 ? "s" : "") + "</div>" : "") + "</td>" +
        "<td>" + pill(st[0], st[1], st[2]) + '</td><td><div class="acts">' + acts + "</div></td></tr>";
    }).join("");
    return '<div class="section-t" style="margin-top:0"><h2>Logins</h2><span class="sub" style="color:var(--muted)">' + n(list.length) + " shown</span></div>" +
      '<div class="tools"><input class="search" type="search" placeholder="Search by email, name or workspace" data-q="users" value="' + esc(S.q.users) + '" aria-label="Search logins">' +
      '<select id="user-state" aria-label="Filter by state">' + ["all", "active", "unconfirmed", "locked", "disabled"].map(function (s) { return '<option value="' + s + '"' + (S.userState === s ? " selected" : "") + ">" + (s === "all" ? "All states" : s.charAt(0).toUpperCase() + s.slice(1)) + "</option>"; }).join("") + "</select></div>" +
      (list.length ? '<div class="tw"><table><thead><tr><th>Login</th><th>Workspaces</th><th>Joined</th><th>Last sign-in</th><th>State</th><th class="r">Actions</th></tr></thead><tbody>' + rows + "</tbody></table></div>" : '<div class="card empty">No logins match.</div>');
  }

  function viewServer(d) {
    var h = d.health, x = (h && h.data) || {}, dk = x.disk, mm = x.memory, b = x.backup || {}, s = x.schedules || {}, db = d.db || {};
    if (!h) return statusBanner(d.issues || []) + '<div class="card empty">The server hasn\'t sent a health snapshot yet. Run <code>ec2/setup.sh</code> again on the server: it installs the 5-minute health job.</div>';
    var dp = dk ? pct(dk.used, dk.total) : null, mp = mm ? pct(mm.total - mm.available, mm.total) : null;
    var certDays = x.cert_expires ? Math.floor((new Date(x.cert_expires) - Date.now()) / 864e5) : null;
    var svc = Object.keys(x.services || {}).map(function (k) { var a = x.services[k] === "active"; return '<div class="svc"><span>' + esc({ postgresql: "Database (PostgreSQL)", postgrest: "Database API (PostgREST)", caddy: "HTTPS (Caddy)", cron: "Schedules (cron)" }[k] || k) + "</span>" + (a ? pill("good", "Running", ICON.ok) : pill("crit", x.services[k] || "Down", ICON.crit)) + "</div>"; }).join("");
    var s3 = { ok: pill("good", "Copied to S3", ICON.ok), failed: pill("crit", "S3 copy failed", ICON.crit), off: pill("warn", "Not copied off-server", ICON.warn), none: pill("mute", "No S3 copy yet") }[b.s3] || "";
    return statusBanner(d.issues || []) +
      '<div class="grid kpis">' +
      kpi("Disk used", dk ? bytes(dk.used) : "N/A", dk ? bytes(dk.free) + " free of " + bytes(dk.total) : "", dp) +
      kpi("Memory used", mm ? bytes(mm.total - mm.available) : "N/A", mm ? bytes(mm.available) + " free of " + bytes(mm.total) : "", mp) +
      kpi("Load", x.load ? Number(x.load[1]).toFixed(2) : "N/A", "5-minute average · " + n(x.cpus) + " CPU" + (x.cpus > 1 ? "s" : "")) +
      kpi("Uptime", dur(x.uptime_s), esc(x.host || "") ) +
      kpi("Database", bytes(db.size_bytes), n(db.connections) + " of " + n(db.max_connections) + " connections") +
      kpi("Last snapshot", esc(ago(h.taken_at)), "every 5 minutes") +
      "</div>" +
      '<div class="grid three" style="margin-top:16px">' +
      '<div class="card"><div class="card-h"><div><h2>Disk</h2><div class="sub">% used, last 24 hours</div></div></div>' + lineChart("disk", charts.disk.pts) + "</div>" +
      '<div class="card"><div class="card-h"><div><h2>Memory</h2><div class="sub">% used, last 24 hours</div></div></div>' + lineChart("mem", charts.mem.pts) + "</div>" +
      '<div class="card"><div class="card-h"><div><h2>Load</h2><div class="sub">5-minute average, last 24 hours</div></div></div>' + lineChart("load", charts.load.pts) + "</div>" +
      "</div>" +
      '<div class="grid three" style="margin-top:16px">' +
      '<div class="card"><div class="card-h"><div><h2>Services</h2><div class="sub">On the database server</div></div></div>' + svc + "</div>" +
      '<div class="card"><div class="card-h"><div><h2>Backups</h2><div class="sub">Nightly, 14 days on the server</div></div>' + s3 + '</div><dl class="kv">' +
      "<dt>Newest</dt><dd>" + esc(b.file || "none") + "</dd><dt>Taken</dt><dd>" + esc(b.at ? ago(b.at) : "N/A") + "</dd><dt>Size</dt><dd>" + bytes(b.bytes) + "</dd><dt>Kept on server</dt><dd>" + n(b.count) + "</dd>" +
      (b.s3_last ? "<dt>S3</dt><dd style=\"font-size:12px\">" + esc(b.s3_last) + "</dd>" : "") + "</dl></div>" +
      '<div class="card"><div class="card-h"><div><h2>Schedules & HTTPS</h2><div class="sub">Last 24 hours</div></div>' + (s.failed_24h ? pill("warn", n(s.failed_24h) + " failed", ICON.warn) : pill("good", "No failures", ICON.ok)) + '</div><dl class="kv">' +
      "<dt>Jobs that worked</dt><dd>" + n(s.ok_24h) + "</dd><dt>Jobs that failed</dt><dd>" + n(s.failed_24h) + "</dd>" + (s.last_failure ? "<dt>Last failure</dt><dd style=\"font-size:12px\">" + esc(s.last_failure) + "</dd>" : "") +
      "<dt>Certificate</dt><dd>" + (certDays == null ? "N/A" : "expires in " + n(certDays) + " days") + "</dd><dt>Kernel</dt><dd style=\"font-size:12px\">" + esc(x.kernel || "") + "</dd></dl></div>" +
      "</div>" +
      '<div class="section-t"><h2>Biggest tables</h2><span class="sub" style="color:var(--muted)">All workspaces together, including indexes</span></div>' +
      '<div class="tw"><table><thead><tr><th>Table</th><th class="r">Rows (approx.)</th><th class="r">Size</th></tr></thead><tbody>' +
      (db.tables || []).map(function (t) { return "<tr><td class=\"main\">" + esc(t.name) + '</td><td class="r num">' + n(t.rows) + '</td><td class="r num">' + bytes(t.bytes) + "</td></tr>"; }).join("") + "</tbody></table></div>";
  }

  function viewEvents(d) {
    var q = S.q.ev.toLowerCase(), lv = S.evLevel, names = {};
    (d.orgs || []).forEach(function (o) { names[o.id] = o.name; });
    var list = (d.events || []).filter(function (e) { return (lv === "all" || e.level === lv || (lv === "admin" && e.source === "admin")) && (!q || (e.area + " " + e.message + " " + (names[e.org_id] || "")).toLowerCase().indexOf(q) >= 0); });
    return '<div class="section-t" style="margin-top:0"><h2>Events</h2><span class="sub" style="color:var(--muted)">Server errors from the site\'s functions and console actions, last 30 days (newest 300)</span></div>' +
      '<div class="tools"><input class="search" type="search" placeholder="Search events" data-q="ev" value="' + esc(S.q.ev) + '" aria-label="Search events">' +
      '<select id="ev-level" aria-label="Filter events">' + [["all", "Everything"], ["error", "Errors"], ["warn", "Warnings"], ["admin", "Console actions"]].map(function (o) { return '<option value="' + o[0] + '"' + (lv === o[0] ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select></div>" +
      (list.length ? '<div class="tw">' + list.map(function (e) {
        var det = e.detail || {}, extra = [det.op && "op " + det.op, det.status && "HTTP " + det.status, names[e.org_id] && "workspace " + names[e.org_id]].filter(Boolean).join(" · ");
        return '<div class="ev"><div class="when">' + esc(when(e.at)) + '</div><div>' + (e.source === "admin" ? pill("info", "Console") : levelPill(e.level)) + '</div><div class="msg"><b style="font-weight:600">' + esc(e.area) + "</b> " + esc(e.message) + (extra ? "<small>" + esc(extra) + "</small>" : "") + "</div></div>";
      }).join("") + "</div>" : '<div class="card empty">' + ((d.events || []).length ? "No events match." : "No events yet. Server errors from the site will show up here.") + "</div>");
  }

  function viewVercel() {
    var v = S.vercel;
    if (!S.data.vercel) return '<div class="card"><h2>Vercel</h2><p style="color:var(--muted)">Not connected. To see deployments here, add these in Vercel › Settings › Environment Variables (Production) and redeploy:</p><dl class="kv" style="max-width:560px"><dt><code>VERCEL_TOKEN</code></dt><dd style="text-align:left">a read-only token (Vercel › Account Settings › Tokens)</dd><dt><code>VERCEL_PROJECT_ID</code></dt><dd style="text-align:left">Project › Settings › General › Project ID</dd><dt><code>VERCEL_TEAM_ID</code></dt><dd style="text-align:left">only if the project is in a team</dd></dl><p style="color:var(--muted);margin-bottom:0">Function errors are already in Events, without a token.</p></div>';
    if (!v) return '<div class="skel"></div>';
    if (v.error) return '<div class="card">' + pill("crit", "Vercel didn't answer", ICON.crit) + '<p style="margin-bottom:0">' + esc(v.error) + "</p></div>";
    var deps = v.deployments || [];
    return '<div class="section-t" style="margin-top:0"><h2>Deployments</h2><span class="sub" style="color:var(--muted)">Newest 12, from the Vercel API</span></div>' +
      (deps.length ? '<div class="tw"><table><thead><tr><th>Change</th><th>Target</th><th>When</th><th>State</th></tr></thead><tbody>' + deps.map(function (x) {
        return "<tr><td><div class=\"main\">" + esc(x.message || "(no message)") + '</div><div class="small">' + esc((x.sha ? x.sha + " · " : "") + x.url) + "</div></td><td>" + (x.target === "production" ? pill("info", "Production") : pill("mute", "Preview")) + "</td><td>" + esc(ago(x.created)) + "</td><td>" + depPill(x.state) + "</td></tr>";
      }).join("") + "</tbody></table></div>" : '<div class="card empty">No deployments found.</div>');
  }

  function renderBody() {
    var d = S.data, v = { overview: viewOverview, orgs: viewOrgs, users: viewUsers, server: viewServer, events: viewEvents, vercel: viewVercel }[S.tab] || viewOverview;
    $("#main").innerHTML = v(d); drawCharts();
  }
  function render() {
    var d = S.data; if (!d) return;
    setupCharts(d.series); var t = totals(d);
    var cnt = { orgs: t.orgs, users: t.users, events: t.errors24 || null, overview: (d.issues || []).filter(function (i) { return i.level !== "info"; }).length || null };
    $("#tabs").innerHTML = TABS.map(function (x) { return '<button class="tab" role="tab" type="button" data-tab="' + x[0] + '" aria-selected="' + (S.tab === x[0]) + '">' + x[1] + (cnt[x[0]] ? '<span class="cnt">' + n(cnt[x[0]]) + "</span>" : "") + "</button>"; }).join("");
    $("#updated").textContent = "Updated " + ago(d.at);
    renderBody();
  }

  api("me").then(function (m) { S.me = m.email; $("#who").textContent = m.email; load(); }, function (e) {
    if (!token() || e.status === 401) gate("Sign in first", "The console uses your Qlarity sign-in. Sign in on the dashboard, then open this page again.", ["/app", "Sign in to Qlarity"]);
    else gate(e.status === 403 ? "Not available" : "The console couldn't load", e.message, ["/app", "Open the dashboard"]);
  });
})();
</script>
</body>
</html>
