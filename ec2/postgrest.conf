# PostgREST for Lead Performance (filled in by ec2/setup.sh; the real file is /etc/postgrest.conf, root/postgrest only).
# Listens on localhost only; Caddy serves it over HTTPS at /rest/v1/ (the path the app's query builder uses).
db-uri = "postgres://authenticator:__PG_AUTH_PASS__@127.0.0.1:5432/lp"
db-schemas = "public"
db-anon-role = "anon"
db-extra-search-path = "public, extensions"
db-pool = 10
db-max-rows = 50000
jwt-secret = "__JWT_SECRET__"
openapi-mode = "disabled"
server-host = "127.0.0.1"
server-port = 3000
log-level = "warn"
