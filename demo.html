<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qlarity — Live Demo Dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/qlarity-icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<script>
try {
  var _t = localStorage.getItem("lp-theme");
  if (_t === "dark" || _t === "light") document.documentElement.setAttribute("data-theme", _t);
} catch (e) {}
// Immediate redirect to interactive demo mode on app
location.replace("/app?demo=1" + (location.hash || ""));
</script>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0a0f1c;color:#eef2fb}
.loader{text-align:center;padding:40px}
.loader h1{font-family:"Inter Tight",sans-serif;font-size:42px;font-weight:700;letter-spacing:-.03em;margin:0 0 12px;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.loader p{color:#8b97b1;font-size:16px}
.spinner{width:40px;height:40px;border:3px solid #1f2a42;border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
a.fallback{display:inline-block;margin-top:16px;color:#60a5fa;text-decoration:none;font-weight:500;font-size:14px}
a.fallback:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <h1>Qlarity</h1>
  <p>Launching interactive demo dashboard…</p>
  <noscript>
    <a class="fallback" href="/app?demo=1">Click here to enter the demo</a>
  </noscript>
</div>
</body>
</html>
